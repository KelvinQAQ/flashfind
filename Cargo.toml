[package]
name = "flashfind"
version = "0.1.0"
edition = "2021"
description = "A low-privilege, cross-platform, fast local file finder"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
getrandom = "0.2"
ignore = "0.4"
notify = "6.1"
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
